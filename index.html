<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <title>눈치코치</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #636E3B;
      overflow: hidden;
    }

    #page {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(12px, 3vh, 35px);
      padding: clamp(12px, 3vh, 40px) clamp(12px, 3vw, 32px);
    }

    #game-logo {
      width: min(420px, 45vw);
      margin: 0 auto;
      flex-shrink: 0;
      position: relative;
      z-index: 20;
    }

    #game-logo img {
      width: 100%;
      height: auto;
      display: block;
      image-rendering: pixelated;
    }

    #game-stage {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      place-items: center;
      container-type: size;
    }

    #unity-container {
      position: relative !important;
      width: min(100cqw, 160cqh) !important;
      height: min(100cqh, 62.5cqw) !important;
      aspect-ratio: 8 / 5;
      margin: 0 auto !important;
      padding: 0 !important;
      left: auto !important;
      right: auto !important;
      top: auto !important;
      bottom: auto !important;
      transform: none !important;
      display: block;
      flex-shrink: 0;
      z-index: 1;
    }

    #unity-canvas {
      position: absolute !important;
      left: 0 !important;
      top: 0 !important;
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      margin: 0 !important;
      padding: 0 !important;
      object-fit: contain;
    }

    #unity-loading-bar {
      position: absolute !important;
      left: 50% !important;
      top: 50% !important;
      transform: translate(-50%, -50%) !important;
      z-index: 10;
    }

    #unity-footer {
      display: block !important;
      position: absolute;
      right: 15px;
      bottom: 15px;
      width: 40px;
      height: 40px;
      z-index: 20;
    }

    #unity-webgl-logo,
    #unity-build-title {
      display: none !important;
    }

    #unity-fullscreen-button {
      display: block !important;
      width: 40px;
      height: 40px;
      cursor: pointer;
    }

    #unity-warning {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      z-index: 100;
    }
  </style>
</head>

<body>

  <div id="page">

    <div id="game-logo">
      <img src="images/nunchicochi_logo.png" alt="눈치코치">
    </div>

    <div id="game-stage">
      <div id="unity-container">

        <canvas
          id="unity-canvas"
          width="960"
          height="600"
          tabindex="-1">
        </canvas>

        <div id="unity-loading-bar">
          <div id="unity-logo"></div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
        </div>

        <div id="unity-warning"></div>

        <div id="unity-footer">
          <div id="unity-webgl-logo"></div>
          <div id="unity-fullscreen-button"></div>
          <div id="unity-build-title">
            nunchicochi
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    var container =
      document.querySelector("#unity-container");

    var canvas =
      document.querySelector("#unity-canvas");

    var loadingBar =
      document.querySelector("#unity-loading-bar");

    var progressBarFull =
      document.querySelector("#unity-progress-bar-full");

    var fullscreenButton =
      document.querySelector("#unity-fullscreen-button");

    var warningBanner =
      document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display =
          warningBanner.children.length
            ? "block"
            : "none";
      }

      var div =
        document.createElement("div");

      div.innerHTML = msg;

      warningBanner.appendChild(div);

      if (type == "error") {
        div.style =
          "background: red; padding: 10px;";
      } else {
        if (type == "warning") {
          div.style =
            "background: yellow; padding: 10px;";
        }

        setTimeout(function() {
          if (div.parentNode) {
            warningBanner.removeChild(div);
          }

          updateBannerVisibility();
        }, 5000);
      }

      updateBannerVisibility();
    }

    var buildUrl = "Build";

    var loaderUrl =
      buildUrl + "/nunchicochi.loader.js";

    var config = {
      dataUrl:
        buildUrl + "/nunchicochi.data",

      frameworkUrl:
        buildUrl + "/nunchicochi.framework.js",

      codeUrl:
        buildUrl + "/nunchicochi.wasm",

      streamingAssetsUrl:
        "StreamingAssets",

      companyName:
        "DefaultCompany",

      productName:
        "nunchicochi",

      productVersion:
        "1.0",

      matchWebGLToCanvasSize:
        false,

      showBanner:
        unityShowBanner
    };

    if (
      /iPhone|iPad|iPod|Android/i.test(
        navigator.userAgent
      )
    ) {
      var meta =
        document.createElement("meta");

      meta.name =
        "viewport";

      meta.content =
        "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";

      document
        .getElementsByTagName("head")[0]
        .appendChild(meta);

      container.className =
        "unity-mobile";

      canvas.className =
        "unity-mobile";

    } else {
      canvas.style.width = "100%";
      canvas.style.height = "100%";
    }

    loadingBar.style.display =
      "block";

    var script =
      document.createElement("script");

    script.src =
      loaderUrl;

    script.onload = () => {
      createUnityInstance(
        canvas,
        config,
        (progress) => {
          progressBarFull.style.width =
            100 * progress + "%";
        }
      )
      .then((unityInstance) => {
        loadingBar.style.display =
          "none";

        if (fullscreenButton) {
          fullscreenButton.onclick =
            () => {
              unityInstance.SetFullscreen(1);
            };
        }
      })
      .catch((message) => {
        alert(message);
      });
    };

    document.body.appendChild(script);
  </script>

</body>
</html>
